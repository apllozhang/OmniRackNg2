# Isolated extension deployment: no fixed container names, no published database port.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请配置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请配置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请配置 POSTGRES_PASSWORD}
    volumes: ["asset-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        SOURCE_SHA256: ${SOURCE_SHA256:-development}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: host=postgres user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=5432 sslmode=disable TimeZone=UTC
      HTTP_ADDR: :8080
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        SOURCE_SHA256: ${SOURCE_SHA256:-development}
    restart: unless-stopped
    ports: ["${ASSET_HTTP_BIND:-127.0.0.1}:${ASSET_HTTP_PORT:-15174}:80"]
    depends_on: [backend]
volumes:
  asset-postgres-data:
