name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go test -race -count=1 ./...
        working-directory: backend
      - run: python3 scripts/api-contract.py --check
      - run: |
          python3 -m unittest discover -s scripts -p 'test*.py'
          python3 scripts/test-nas-release.py
          python3 -O scripts/test-nas-release.py
          python3 scripts/test-nas-stage-release.py
          python3 -O scripts/test-nas-stage-release.py
          python3 scripts/test-omni-workspace.py
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --maxWorkers=2
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go build -o "$RUNNER_TEMP/omnirack-server" ./cmd/server
        working-directory: backend
      - run: python3 scripts/integration-replica.py --pg-image postgres:16-alpine --server "$RUNNER_TEMP/omnirack-server" --go-invariants --output "$RUNNER_TEMP/integration-result"
